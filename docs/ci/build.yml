# CI workflow, kept here until the GitHub login has the "workflow" scope.
# To turn it on: GitHub website > Add file > Create new file > .github/workflows/build.yml, paste this file.
name: Build and test
on:
  push: { branches: [main, sprint] }
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew --console=plain testStudioDebugUnitTest assembleStudioDebug
